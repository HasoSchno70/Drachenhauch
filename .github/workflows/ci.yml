name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Ein Lauf je Ereignisart und Commit. GitHub hat den Merge von #172 zweimal
# gemeldet (zwei pr_merge-Eintraege in derselben Sekunde) und daraus zwei
# main-Laeufe fuer denselben Commit gemacht. Ueberlappen sie, bricht der
# spaetere den frueheren ab; ein neuer Commit hat eine andere SHA und laeuft
# ungestoert. PR-Laeufe haben ihre eigene Merge-SHA, kollidieren also nicht
# mit dem main-Lauf nach dem Merge.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  # Seit 2026-09-21 OHNE pytest, mypy und pip (docs/entwurf-python-abbau.md,
  # 7.7 Punkt 6): geprueft wird nur noch ueber `dhrt test tests/pruef`. Python
  # bleibt allein fuer den Bauschritt (`rust/build_runtime.py`, nur
  # Standardbibliothek -- `tests/pruef/bauskripte.dhtest` haelt das fest) und
  # fuer die Probe von `rust/build_wasm.py` in `tests/pruef/build_wasm.dhtest`.
  # Die Qt-Editoren und ihre pytest-Dateien sind damit NICHT mehr geprueft;
  # sie fallen im Loeschschritt (Punkt 7).
  #
  # Job-Name und Matrix bleiben, obwohl es nur noch eine Version gibt: `main`
  # verlangt die Pruefung "test (3.12)" beim NAMEN. Ein neuer Name meldete
  # sich nie, und jeder PR stuende fuer immer auf "erwartet".
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    env:
      # Fettes LTO (`lto = true` in Cargo.toml) optimiert beim Linken das ganze
      # Programm neu und parallelisiert dabei kaum -- auf einem Runner mit
      # wenigen Kernen ist das der teuerste einzelne Schritt. Gemessen lokal auf
      # 16 Kernen, inkrementell nach einer Aenderung an vm.rs:
      #   fat  79 s     thin  54 s
      # Hier zaehlt ein KORREKTES Binary, kein maximal optimiertes -- getestet
      # wird Verhalten, nicht Geschwindigkeit. `thin` optimiert weiter ueber
      # Crate-Grenzen, kostet aber einen Bruchteil.
      #
      # Bewusst als Umgebungsvariable statt als Profil im Cargo.toml: das
      # ausgelieferte Binary (package.yml) behaelt fettes LTO, und niemand muss
      # daran denken.
      #
      # EHRLICH DAZU: das hier getestete Binary ist damit nicht bitgleich mit dem
      # ausgelieferten. Ein Fehler, der NUR bei fettem LTO auftraete, faende
      # dieser Lauf nicht. Das waere ein Compiler-Fehler und entsprechend selten;
      # der Handel ist bewusst.
      CARGO_PROFILE_RELEASE_LTO: thin

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # Gebaut wird HIER, nicht vorgebaut von der Platte genommen: als die
      # Tests noch pytest waren, zerlegte ein kaputter `include_str!`-Pfad in
      # compiler.rs den Rust-Build, und niemand merkte es, weil die Tests die
      # alte Exe nahmen.
      #
      # Gebaut wird ueber `rust/build_runtime.py` -- dasselbe Skript, das auch
      # Entwickler benutzen. Eine zweite Bau-Wahrheit in der CI waere genau
      # die Sorte Abweichung, die man erst bemerkt, wenn sie auseinanderlaeuft.
      #
      # MIT Grafik, nicht ohne: ohne das `graphics`-Feature liefert
      # `try_graphics` in vm.rs nur `Ok(None)`, SCREEN & Co. gelten dann als
      # unbekannte Builtins -- die Grafik-Tests wuerden FEHLSCHLAGEN statt zu
      # ueberspringen.
      - uses: dtolnay/rust-toolchain@stable

      - name: Rust-Abhaengigkeiten cachen
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/drachenhauch_runtime

      - name: dhrt bauen (Runtime fuer die Pruefsammlungen)
        run: python rust/build_runtime.py

      # Die Pruefsammlungen laufen DIREKT, nicht ueber pytest: bis 2026-09-20
      # rief `tests/test_dhrt_test.py` sie als Anker auf, und die Datei faellt
      # mit dem Python-Teil weg (Weg D). Das FORMAT der Sammlungen prueft
      # seither `tests/pruef/dhrt_test_format.dhtest` -- sie pruefen sich also
      # selbst.
      #
      # `DH_OHNE_AUDIO=1`: das setzte bisher conftest.py fuer die pytest-Laeufe,
      # und der Anker erbte es. Ohne die Variable sucht jedes Programm mit Ton
      # ein Ausgabegeraet -- der Runner hat keins ("NoDefaultOutputDevice").
      #
      # GEMESSEN am 2026-09-20, als dieser Schritt neu war: 24 Faelle rot, die
      # tags zuvor ueber den Anker gruen waren -- bei GLEICHER Image-Version
      # ("windows-2025-vs2026") und demselben Aufruf (nachgestellt, ebenfalls
      # rot). Der Runner hat also mal einen OpenGL-Treiber und mal nicht
      # ("WGL: The driver does not appear to support OpenGL"). Getragen wird
      # das jetzt von der Ueberspring-Erkennung in `pruefsammlung.rs`, die seit
      # demselben Tag auch greift, wenn der Fall selbst mit 0 endet und nur
      # sein KIND kein Fenster bekam.
      - name: Pruefsammlungen (dhrt test)
        env:
          DH_OHNE_AUDIO: 1
        run: rust/drachenhauch_runtime/target/release/dhrt.exe test tests/pruef

      # Regel 3 aus docs/entwurf-maschinencode.md: jede Sammlung auf beiden
      # Wegen, dieselbe Erwartung. Seit M5 ist der Maschinencode Vorgabe (der
      # Lauf oben), hier dieselben Sammlungen in der VM allein. `--schnell`
      # -- die langsamen Sammlungen (IDE, Werkzeuge) laufen oben mit
      # Maschinencode; Linux und macOS fahren beide Wege ganz.
      - name: Pruefsammlungen ohne Maschinencode (DHRT_JIT=aus)
        env:
          DH_OHNE_AUDIO: 1
          DHRT_JIT: aus
        run: rust/drachenhauch_runtime/target/release/dhrt.exe test tests/pruef --schnell

  # Cross-Platform-Migration Phase 3: auf Linux UND macOS nicht nur BAUEN,
  # sondern TESTEN.
  #
  # Bis 2026-08-20 lief die Suite ausschliesslich unter Windows; Linux und
  # macOS bekamen `cargo check` (Job unten). Das war vertretbar, solange
  # Drachenhauch Spiele exportierte. Seit es auch Kommandozeilen-Werkzeuge,
  # Cron-Jobs und Dienste schreiben soll, ist es das nicht mehr -- die laufen
  # erfahrungsgemaess woanders.
  #
  # Linux kam zuerst und hat sich sofort bezahlt gemacht: die Zip-Slip-
  # Pruefung liess `C:/Windows/...` durch, weil das NUR auf Windows ein
  # absoluter Pfad ist. macOS folgt derselben Vorlage -- ein drittes System
  # kostet hier nur eine Zeile Matrix und faengt genau solche Annahmen.
  #
  # Der Kniff: `dhrt` OHNE Grafik bauen (`default = []`, also kein raylib).
  # Damit braucht der Runner weder X11 noch GL noch einen virtuellen
  # Bildschirm. Gemessen kommen so 2978 Tests durch und 367 werden
  # uebersprungen -- die Sprache selbst, Dateien, Netz, Datenbank, CSV, ZIP,
  # Mengen, Namensraeume und Hintergrund-Auftraege sind vollstaendig dabei.
  # Uebersprungen wird, was Pixel, Fenster, Audio-Pegel oder Eingabe prueft
  # (`_BRAUCHT_GRAFIK` in conftest.py, empirisch ermittelt).
  #
  # `DHRT_OHNE_GRAFIK=1` schaltet das Ueberspringen frei. Ohne die Variable
  # aendert sich nichts -- der Windows-Lauf oben sieht einen fehlenden
  # Grafik-Builtin weiterhin als Fehler, sonst versteckt diese Bequemlichkeit
  # eines Tages eine echte Luecke.
  posix-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      DHRT_OHNE_GRAFIK: "1"
      # Wie im Windows-Job: fettes LTO ist der teuerste Schritt und fuer einen
      # Testlauf unnoetig. Begruendung dort.
      CARGO_PROFILE_RELEASE_LTO: thin

    # Kein setup-python: gebaut wird mit cargo direkt, und die eine Probe, die
    # Python braucht (build_wasm.dhtest), nimmt das python3 des Laeufers.
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust-Abhaengigkeiten cachen
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/drachenhauch_runtime

      # Ohne `graphics`: kein raylib, kein cmake, keine X11-Header. Mit db/net/
      # http/smtp, weil genau die Bereiche hier zaehlen.
      #
      # `smtp` gehoert dazu, obwohl es hier wie eine Zugabe aussieht: die
      # Feature-Liste muss den Modulen folgen, die `tests/` abfragt. Fehlt
      # eines, laeuft dhrt zwar, aber jeder Aufruf des Moduls meldet "ohne das
      # Feature gebaut" -- 26 Fehler in `tests/test_smtp.py` (heute
      # `tests/pruef/smtp.dhtest`), die es nur auf
      # posix gab, weil der Windows-Job ueber `build_runtime.py` baut und das
      # Skript den ganzen Daten-Tier mitnimmt. Wer hier ein Feature ergaenzt,
      # gleicht am besten gegen `feats` in `rust/build_runtime.py` ab.
      - name: dhrt bauen (ohne Grafik)
        working-directory: rust/drachenhauch_runtime
        run: cargo build --release --locked --features "db net http smtp jit"

      # Wie im Windows-Job: die Sammlungen direkt, ohne pytest als Anker.
      # Ohne Grafik ueberspringen sich die Fenster-Faelle selbst.
      - name: Pruefsammlungen (dhrt test)
        run: rust/drachenhauch_runtime/target/release/dhrt test tests/pruef

      # Dieselben Sammlungen ohne Maschinencode (Regel 3 aus
      # docs/entwurf-maschinencode.md; seit M5 ist der Lauf oben der mit
      # Maschinencode -- auf macOS zugleich der Beleg fuer arm64).
      - name: Pruefsammlungen ohne Maschinencode (DHRT_JIT=aus)
        env:
          DHRT_JIT: aus
        run: rust/drachenhauch_runtime/target/release/dhrt test tests/pruef

  # Cross-Platform-Migration Phase 2: erstes automatisches Signal, ob der
  # Rust-Kern (dhrt) auch auf Linux/macOS ueberhaupt kompiliert -- bisher
  # (Stand 2026-07) lief/baute dhrt ausschliesslich unter Windows, nie in CI
  # verifiziert. Bewusst ohne `graphics` (braucht cmake/ALSA/X11-Wayland-Dev-
  # Header, ein spaeterer Schritt) -- hier zaehlt erstmal, ob VM-Kern +
  # Daten-Tier (db/net/http/smtp) + das wifi-Feature (Phase 3: Linux/macOS-Zweige
  # noch UNGETESTET, dieser Job ist ihr erstes echtes Kompilier-Signal)
  # plattformunabhaengig sind. serial/usb/bt bleiben vorerst aussen vor --
  # die brauchen zusaetzliche System-Bibliotheken (libudev/D-Bus) und sind
  # ein spaeterer Schritt.
  rust-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rust/drachenhauch_runtime

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: cargo check (VM-Kern, ohne Grafik/Daten/Hardware)
        run: cargo check --locked

      # Die Feature-Liste folgt dem Daten-Tier aus `feats` in
      # `rust/build_runtime.py` -- wer dort eines ergaenzt, ergaenzt es hier
      # mit, sonst kompiliert der neue Modul-Code auf Linux/macOS nie.
      - name: cargo check (+ db/net/http/smtp)
        run: cargo check --locked --features "db net http smtp"

      - name: cargo check (+ wifi)
        run: cargo check --locked --features "wifi"

      # Barrierefreiheit: die Adapter fuer UIA (Windows), NSAccessibility
      # (macOS) und AT-SPI (Linux) haengen am graphics-Feature, das die CI
      # nicht baut -- als eigenes Feature `a11y` uebersetzt sie jeder Laeufer
      # fuer SEIN System (ohne raylib). Gebaut, nicht gelaufen: auf dieser
      # Entwicklungsmaschine gibt es macOS und Linux nicht.
      - name: cargo check (+ a11y, die AccessKit-Adapter dieses Systems)
        run: cargo check --locked --features "a11y"

      # Die Rust-#[test]s liefen bis 2026-09-06 NIRGENDS: die CI prueft nur
      # (cargo check), und lokal scheiterte `cargo test` an raylibs
      # MAX_PATH -- zwei kaputte Tests (gui.rs, gifschreiber.rs) lagen so
      # unbemerkt herum. Ohne Grafik-Feature, wie die Checks davor; die
      # Grafik-Tests laufen lokal mit CARGO_TARGET_DIR=C:/dht.
      - name: cargo test (ohne Grafik)
        run: cargo test --locked --features "db net http smtp jit"
