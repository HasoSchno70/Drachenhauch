name: Package (manuell)

on:
  workflow_dispatch:

# Cross-Platform-Migration Phase 4: verifiziert, dass installer/build_installer.py
# auf allen drei Plattformen tatsaechlich eine Distribution produziert (Windows-
# Installer/macOS-.dmg/Linux-Tarball). NICHT Teil der normalen push/PR-CI, weil
# der volle Lauf (PySide6/numpy/Pillow-Installation + PyInstaller) mehrere Minuten
# pro OS braucht und kein Push-blockierendes Korrektheitskriterium ist -- manuell
# ueber den Actions-Tab ("Run workflow") ausloesen.
#
# dhrt wird hier nur mit --no-graphics gebaut (schnell, keine System-Bibliotheken
# noetig) -- das erzeugte Bundle enthaelt also NICHT die volle, fuer echte Nutzer
# gedachte Runtime, nur genug um zu pruefen, dass die Paketier-Schritte selbst
# (Icon-Erzeugung/PyInstaller/DMG/Tarball/Inno Setup) funktionieren.
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Python-Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[editors,package]"

      - name: dhrt bauen (--no-graphics, nur fuer Bundle-Struktur-Test)
        run: python rust/build_runtime.py --no-graphics

      # Windows: Inno Setup ist auf den GH-Runnern nicht vorinstalliert --
      # --no-installer testet nur den PyInstaller-Schritt (der Windows-Zweig
      # inkl. Inno ist bereits lokal etabliert/verifiziert). macOS/Linux
      # brauchen kein zusaetzliches Tool (hdiutil ist auf macos-latest
      # vorinstalliert, der Tarball-Schritt ist reines Python).
      - name: Distribution bauen (Windows)
        if: runner.os == 'Windows'
        run: python installer/build_installer.py --no-installer

      - name: Distribution bauen (macOS/Linux)
        if: runner.os != 'Windows'
        run: python installer/build_installer.py

      - name: Artefakte hochladen
        uses: actions/upload-artifact@v7
        with:
          name: drachenhauch-${{ matrix.os }}
          path: |
            dist/
            installer/output/
          if-no-files-found: warn
          retention-days: 7

  # Die Pakete OHNE Python fuer macOS und Linux (installer/bauen.dh +
  # installer/paket.dh, 2026-09-19): dhrt MIT Grafik bauen -- das ist hier
  # zum ersten Mal auf diesen Systemen der Fall, die CI baut dort sonst ohne
  # --, dann packt dhrt sich selbst, und das Paket wird ausprobiert:
  #   Linux: entpacken, install.sh mit eigenem HOME, die IDE 60 Bilder lang
  #          unter xvfb starten, dann die Sammlung werkzeug_paket.dhtest mit
  #          dieser Laufzeit (dort startet der Starter die IDE echt).
  #   macOS: das .dmg einhaengen, Signatur und Aufbau pruefen, die App 60
  #          Bilder lang starten.
  # Gebaut wird ohne Python: cargo direkt, mit derselben CFLAGS-Zeile wie
  # rust/build_runtime.py (Tipp-Warteschlange 256).
  paket-ohne-python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CFLAGS: -DMAX_CHAR_PRESSED_QUEUE=256
      CARGO_PROFILE_RELEASE_LTO: thin

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust-Abhaengigkeiten cachen
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/drachenhauch_runtime

      # raylib baut GLFW fuer X11 UND Wayland; Kira spielt ueber ALSA, die
      # Dialoge (rfd) brauchen GTK 3. xvfb fuer den Startversuch.
      - name: System-Bibliotheken (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libasound2-dev libgtk-3-dev \
            libx11-dev libxrandr-dev libxi-dev libxinerama-dev libxcursor-dev \
            libgl1-mesa-dev libwayland-dev libxkbcommon-dev wayland-protocols \
            xvfb xauth

      - name: dhrt bauen (mit Grafik)
        working-directory: rust/drachenhauch_runtime
        run: cargo build --release --locked --features "graphics dialogs db net http smtp"

      - name: Laufzeit ansehen
        run: rust/drachenhauch_runtime/target/release/dhrt --version

      - name: Paket bauen
        run: rust/drachenhauch_runtime/target/release/dhrt run installer/bauen.dh

      - name: Paket ausprobieren (Linux)
        if: runner.os == 'Linux'
        run: |
          set -e
          cd "$RUNNER_TEMP"
          tar xzf "$GITHUB_WORKSPACE"/installer/output/Drachenhauch-IDE-*-linux-*.tar.gz
          export HOME="$RUNNER_TEMP/home"
          mkdir -p "$HOME"
          sh Drachenhauch-IDE-*/install.sh
          test -x "$HOME/.local/share/drachenhauch-ide/dhrt"
          "$HOME/.local/bin/dhrt" --version
          DHRT_FRAMES=60 DH_IDE_LOG="$RUNNER_TEMP/ide.log" DH_IDE_KONFIG="$RUNNER_TEMP/ide.json" \
            xvfb-run -a "$HOME/.local/bin/drachenhauch"
          cat "$RUNNER_TEMP/ide.log" | head -20
          grep -qx bereit "$RUNNER_TEMP/ide.log"
          test -f "$HOME/Drachenhauch/examples/183_sfx_generator.dh"

      - name: Sammlung werkzeug_paket (Linux, mit Grafik)
        if: runner.os == 'Linux'
        run: xvfb-run -a rust/drachenhauch_runtime/target/release/dhrt test tests/pruef/werkzeug_paket.dhtest

      - name: Paket ausprobieren (macOS)
        if: runner.os == 'macOS'
        run: |
          set -e
          DMG=$(ls "$GITHUB_WORKSPACE"/installer/output/Drachenhauch-IDE-*-macos-*.dmg)
          hdiutil attach "$DMG" -mountpoint "$RUNNER_TEMP/abbild" -nobrowse
          APP="$RUNNER_TEMP/abbild/Drachenhauch.app"
          ls -la "$RUNNER_TEMP/abbild"
          codesign --verify --deep --strict --verbose=2 "$APP"
          plutil -lint "$APP/Contents/Info.plist"
          test -x "$APP/Contents/MacOS/dhrt"
          test -x "$APP/Contents/MacOS/Drachenhauch"
          "$APP/Contents/MacOS/dhrt" --version
          export HOME="$RUNNER_TEMP/home"
          mkdir -p "$HOME/Documents"
          DHRT_FRAMES=60 DH_IDE_LOG="$RUNNER_TEMP/ide.log" DH_IDE_KONFIG="$RUNNER_TEMP/ide.json" \
            "$APP/Contents/MacOS/Drachenhauch"
          cat "$RUNNER_TEMP/ide.log" | head -20
          grep -qx bereit "$RUNNER_TEMP/ide.log"
          test -f "$HOME/Documents/Drachenhauch/examples/183_sfx_generator.dh"
          hdiutil detach "$RUNNER_TEMP/abbild"

      - name: Sammlung werkzeug_paket (macOS, mit Grafik)
        if: runner.os == 'macOS'
        run: rust/drachenhauch_runtime/target/release/dhrt test tests/pruef/werkzeug_paket.dhtest

      - name: Pakete hochladen
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: drachenhauch-ide-${{ matrix.os }}
          path: |
            installer/output/*.tar.gz
            installer/output/*.dmg
          if-no-files-found: warn
          retention-days: 14
