[package]
name = "drachenhauch_runtime"
# Dieselbe Fassung wie pyproject.toml und drachenhauch/__init__.py -- `dhrt
# --version` gibt sie aus, und tests/test_version.py haelt die drei
# Angaben zusammen. (Cargo verlangt drei Stellen, das Projekt nennt sich
# "2026.12".)
version = "2026.12.0"
edition = "2021"
description = "Native Drachenhauch runtime (Rust). Loads .dhc bytecode, executes VM core; optional raylib graphics."

[[bin]]
name = "dhrt"
path = "src/main.rs"

[dependencies]
# preserve_order: JSON-Objekt-Keys behalten Einfuege-Reihenfolge (wie Python
# json) -- noetig fuer bit-identisches JSON_STRINGIFY.
serde_json = { version = "1", features = ["preserve_order"] }
# ZIP (ZIP_*). Pure-Rust (Deflate ueber flate2/miniz_oxide, das ueber ureq
# ohnehin schon in der Lockfile steht) -- keine C-Toolchain. default-features
# aus: sonst kaemen bzip2/zstd/AES mit, die niemand angefragt hat.
zip = { version = "2", default-features = false, features = ["deflate"] }
# regex-Modul (REGEX_*). Pure-Rust, klein -> immer dabei (kein Feature-Gate).
regex = "1"
# Schneller Nicht-DoS-Hasher fuer interne Lookup-Maps (Funktionen/Klassen/
# Instanz-Felder) -- Keys kommen aus dem Compiler, nicht von Angreifern.
rustc-hash = "2"
# COMPRESS$/DECOMPRESS$ (DEFLATE). Pure-Rust und ohnehin schon transitiv in der
# Lockfile -> ungated, damit auch Konsolen-Programme ihre Savegames packen
# koennen (raylibs CompressData haengt dagegen am graphics-Feature).
miniz_oxide = "0.8"
# Animierte GIFs schreiben (IMAGE_SAVE_GIF). raylib kann sie nur LESEN.
# Pure-Rust (LZW ueber weezl, Farbreduktion ueber color_quant), keine
# C-Toolchain -> ungated wie die anderen reinen Rust-Crates.
#
# BEWUSST eine Crate statt Handarbeit: GIF komprimiert mit LZW, und ein
# LZW-Schreiber ist die Art Code, die auf den ersten Blick stimmt und in
# einem Randfall still etwas Falsches liefert -- dieselbe Begruendung wie
# unten bei den Pruefsummen.
gif = "0.13"
# physics3d-Modul (PHYS3D_*): echte 3D-Starrkoerper-Physik. Pure-Rust (nalgebra),
# keine C-Toolchain -> ungated immer dabei.
rapier3d = "0.22"
# physics2d-Modul (PHYS2D_*): echte 2D-Starrkoerper-Physik. Ebenfalls pure-Rust.
rapier2d = "0.22"
# Pruefsummen und Identitaet (WP D: SHA256$/SHA1$/MD5$/HMAC_SHA256$/UUID4$/
# RANDOM_BYTES). Alles RustCrypto bzw. pure-Rust, keine C-Toolchain -> ungated:
# ein Konsolenprogramm, das eine Pruefsumme bildet, soll nicht ausgerechnet das
# http-Feature brauchen. `sha1`, `digest`, `uuid` und `getrandom` lagen ohnehin
# schon transitiv in der Lockfile (ueber ureq/rustls); `sha2`/`hmac`/`md-5`
# gehoeren derselben Familie an und teilen sich deren `digest`-Traits.
#
# BEWUSST Crates statt Handarbeit: eine Hash-Funktion selbst zu schreiben ist
# die Art Code, die auf den ersten Blick stimmt und in einem Randfall still
# etwas anderes liefert -- und hier haengt eine Signaturpruefung daran. Die
# Testvektoren aus den Normen laufen trotzdem als Golden-Tests mit.
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
hmac = "0.12"
uuid = { version = "1", features = ["v4"] }
getrandom = "0.2"
# Grafik ist optional: der pure VM-Kern baut ohne C-Toolchain. Mit
# `--features graphics` wird raylib eingebunden (braucht cmake + C-Compiler +
# libclang fuer bindgen -- siehe rust/build_runtime.py).
raylib = { version = "6.0", optional = true, features = ["SUPPORT_IMAGE_GENERATION", "SUPPORT_FILEFORMAT_JPG", "SUPPORT_FILEFORMAT_BMP"] }
# db-Modul: SQLite (bundled = eigenes sqlite3.c, kein System-SQLite noetig).
rusqlite = { version = "0.31", features = ["bundled"], optional = true }
# html-Modul: blockierender HTTP-Client (rustls-TLS fuer https).
ureq = { version = "2", optional = true }
# smtp-Modul: E-Mail verschicken. Das Protokoll selbst ist std::net, aber
# ohne TLS ist es heute unbrauchbar -- jeder Anbieter verlangt STARTTLS oder
# TLS-von-Anfang-an. rustls und webpki-roots liegen ueber ureq ohnehin schon
# in der Lockfile; sie kosten hier also nichts Neues im Abhaengigkeitsbaum.
# `ring` als Krypto-Anbieter (NICHT die Vorgabe aws-lc-rs), weil der eine
# C-Toolchain mitbraeuchte -- dieselbe Wahl, die ureq schon getroffen hat.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"], optional = true }
webpki-roots = { version = "0.26", optional = true }
# Hardware/IoT-Module (Phase 4):
serialport = { version = "4", optional = true }   # serial
hidapi = { version = "2", optional = true }        # usb (HID)
midir = { version = "0.11", optional = true }      # midi (WinMM/ALSA/CoreMIDI)
btleplug = { version = "0.11", optional = true }   # bt (BLE, async)
tokio = { version = "1", features = ["rt-multi-thread", "time"], optional = true }
futures = { version = "0.3", optional = true }
# Audio-Backend Kira (cpal): entkoppelt vom Game-Loop, Busse/Echtzeit-Effekte.
# Pure-Rust (keine C-Toolchain). MOD/XM via xmrs/xmrsplayer (ebenfalls pure-Rust).
# Seit 2026-06-13 DAS Audio-Backend von dhrt (loeste raylib-Audio ab); wird mit
# `graphics` eingebunden -- src/audio.rs.
kira = { version = "0.12", optional = true }
# mint: winzige, abhaengigkeitsfreie Interop-Structs (Vector3/Quaternion) --
# Kiras Listener/Spatial-Track-API nimmt Positionen/Rotationen als `mint`-Typen
# entgegen; bereits transitiv ueber kira in der Lockfile (0.5.9), hier nur
# direkt benannt, damit audio.rs sie ohne glam konstruieren kann.
mint = { version = "0.5", optional = true }
xmrs = { version = "0.13", optional = true }
xmrsplayer = { version = "0.13", optional = true }
# Native OS-Datei-/Ordner-Dialoge (FILE_OPEN_DIALOG/FILE_SAVE_DIALOG/FOLDER_DIALOG).
# Desktop-GUI -> ans graphics-Feature gekoppelt. Auf Windows pure-Rust (windows-sys),
# keine C-Toolchain.
rfd = { version = "0.14", optional = true }
# Barrierefreiheit (docs/entwurf-barrierefreiheit.md, Weg C): das gui-Modul
# schiebt seinen Widget-Baum an die Schnittstelle des Systems (Windows: UI
# Automation), damit Bildschirmleser, Lupe und Sprachsteuerung ihn sehen.
# Reines Rust; der Baum wird nur gebaut, wenn ein Hilfsprogramm danach fragt.
accesskit = { version = "0.25", optional = true }

# --- Web-Build (emscripten): wasm-bindgen-Familie festnageln ---------------
# Kira zieht cpal fuer JEDES wasm32-Ziel mit dem Feature `wasm-bindgen` herein
# -- auch fuer emscripten, wo der WebAudio-Host gar nicht gebraucht wird (ein
# Ziel-Filter-Fehler in Kiras Manifest: die Abhaengigkeit steht unter
# cfg(target_arch = "wasm32") statt cfg(target_os = "unknown")). Er wird also
# mitkompiliert, und ab wasm-bindgen 0.2.12x tut er das nicht mehr (neue
# MaybeUnwindSafe-Schranke, gegen die cpal 0.17 nicht geschrieben ist).
#
# Deshalb hier die letzte Version festgehalten, mit der er uebersetzt. Betrifft
# NUR den emscripten-Build -- auf dem Desktop ist wasm-bindgen gar nicht dabei.
# Drucken (PDF_PRINT) und OPENDOC unter Windows: GDI, winspool, ShellExecute.
# Das Crate liegt ueber andere Abhaengigkeiten ohnehin im Baum; hier nur die
# Features, die die Druckseite braucht. Unter macOS/Linux druckt CUPS (`lp`).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Printing", "Win32_Storage_Xps", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_Ime"] }
# UIA-Adapter von AccessKit: haengt sich per Subclassing an raylibs GLFW-Fenster.
accesskit_windows = { version = "0.35", optional = true }

[target.'cfg(target_os = "emscripten")'.dependencies]
wasm-bindgen = "=0.2.100"
# Im Browser WebGL 2 statt WebGL 1 verlangen. Der Grund ist die Shader-Sprache:
# WebGL 1 spricht GLSL ES 1.00 (kein `in`/`out`, kein `texture()`, kein
# `textureLod`) -- unsere Beleuchtungs-, PBR-, Skybox- und Instancing-Shader
# sind Desktop-GLSL 330 und uebersetzen dort GAR NICHT, 3D blieb schwarz.
# WebGL 2 spricht GLSL ES 3.00, und das ist bis auf die Versionszeile und die
# Praezisions-Angaben dasselbe wie 330. Statt alles auf eine aeltere Sprache
# herunterzuschreiben (und dabei IBL zu verlieren) heben wir also das Ziel an.
# Cargo-Features sind additiv je Ziel -- der Desktop bleibt bei OpenGL 3.3.
raylib = { version = "6.0", optional = true, features = ["opengl_es_30"] }

[features]
default = []
# Grafik (raylib: Fenster/GL/Input) + Audio (Kira: src/audio.rs) + native Dialoge.
graphics = ["dep:raylib", "dep:kira", "dep:mint", "dep:xmrs", "dep:xmrsplayer", "dep:accesskit", "dep:accesskit_windows"]
# Native OS-Dialoge (rfd) -- vom graphics-Feature GETRENNT, weil sie es im
# Web-Build blockieren: rfd zieht js-sys/wasm-bindgen in einer Version nach,
# die cpals WebAudio-Host nicht mehr uebersetzt. Auf dem Desktop immer mit
# dabei (build_runtime.py), im WASM-Build weggelassen.
dialogs = ["dep:rfd"]
db = ["dep:rusqlite"]
net = []                       # nur std::net -- Gate dient dem Opt-out
http = ["dep:ureq"]
smtp = ["dep:rustls", "dep:webpki-roots"]
serial = ["dep:serialport"]
usb = ["dep:hidapi"]
midi = ["dep:midir"]
wifi = []                      # nur std::process (netsh) -- Gate fuer Opt-out
bt = ["dep:btleplug", "dep:tokio", "dep:futures"]
hardware = ["serial", "usb", "wifi", "bt", "midi"]
full = ["graphics", "dialogs", "db", "net", "http", "smtp", "hardware"]

[profile.release]
opt-level = 3
lto = true
