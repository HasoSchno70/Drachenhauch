# Stackgroesse des Hauptthreads.
#
# Die VM rekursiert fuer jeden GB-Funktionsaufruf ueber den NATIVEN Stack
# (exec -> run_frame -> dispatch -> exec). Gemessen kostet ein Aufrufrahmen
# ~6,6 KB -- unabhaengig davon, ob es eine freie Funktion, eine Methode, ein
# BYREF-Aufruf, ein FUNCREF oder ein ueberladener Operator ist.
#
# Windows gibt einem Programm per Vorgabe 1 MB. Das reichte fuer ganze
# 146 Ebenen: ein rekursiver Flood-Fill ueber ein 40x40-Feld stuerzte ab, und
# `MAX_CALL_DEPTH` in vm.rs (die Grenze, die eine unendliche Rekursion in einen
# lesbaren Fehler verwandeln soll) wurde NIE erreicht -- der native Stack lief
# vorher ueber, mit "thread 'main' has overflowed its stack" und ohne jeden
# Hinweis auf die Programmzeile.
#
# 64 MB kosten nichts: das ist reservierter ADRESSRAUM, belegt wird nur, was
# wirklich benutzt wird (SizeOfStackCommit bleibt bei 4 KB). Auf 64-Bit-
# Systemen ist das folgenlos.
#
# LINUX steht bewusst nicht in dieser Datei: dort bekommt der Hauptthread
# seinen Stack aus RLIMIT_STACK (ueblich 8 MB), Linker-Flags aendern daran
# nichts. 8 MB tragen gemessen ~1250 Ebenen -- deshalb liegt MAX_CALL_DEPTH
# bei 1000 und nicht hoeher: die Grenze soll auf JEDER Plattform zuerst
# greifen, damit ueberall dieselbe Fehlermeldung kommt statt mal einer
# Meldung und mal eines Absturzes. Wer sein ulimit ungewoehnlich klein
# gesetzt hat (Container mit `ulimit -s 2048`), faellt darunter -- dann
# stuerzt es wie frueher ab.

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "link-arg=/STACK:67108864"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "link-arg=/STACK:67108864"]

[target.x86_64-pc-windows-gnu]
rustflags = ["-C", "link-arg=-Wl,--stack,67108864"]

[target.x86_64-apple-darwin]
rustflags = ["-C", "link-arg=-Wl,-stack_size,0x4000000"]

[target.aarch64-apple-darwin]
rustflags = ["-C", "link-arg=-Wl,-stack_size,0x4000000"]
