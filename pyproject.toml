[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drachenhauch"
version = "2026.3"
description = "Drachenhauch - eine BASIC-artige Sprache fuer die Spieleentwicklung"
# 3.12 ist das, was tatsaechlich geprueft wird: CI faehrt nur diese Version,
# der Windows-Installer buendelt sie, mypy prueft gegen sie. Vorher stand hier
# ">=3.10" -- eine Zusage, die niemand einloest (3.10 wurde nie getestet, 3.11
# flog am 01.08. aus der Matrix). Auf 3.10/3.11 laeuft der Code vermutlich
# weiter; wer es dort braucht, kann die Grenze lokal senken und selbst testen.
requires-python = ">=3.12"
authors = [{ name = "Hans Schnorrenberger" }]
readme = { text = "Drachenhauch - BASIC-Dialekt mit Pascal-strikter Typisierung und OOP, fuer Spiele.", content-type = "text/plain" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Interpreters",
]
dependencies = []

[project.optional-dependencies]
# Grafik/Audio laufen in der nativen Runtime (dhrt, Rust/raylib) -- pygame wurde
# entfernt. Die optionalen Editoren (Code/Sprite/Tilemap/SFX/Tracker) sind
# PySide6-basiert; die SFX-/Tracker-Audio-Vorschau nutzt sounddevice + soundfile.
editors = ["PySide6>=6.5", "Pillow>=10", "numpy>=1.24", "sounddevice>=0.4", "soundfile>=0.12"]
dev = ["pytest>=7", "mypy>=1.8"]
# Hardware-Module (jeweils separat installierbar via `pip install drachenhauch[serial]`)
serial = ["pyserial>=3.5"]
usb = ["hidapi>=0.14"]
bt = ["bleak>=0.21"]
# wifi: braucht keine externe Lib (netsh/nmcli/networksetup je nach OS)
hw = [
    "pyserial>=3.5",
    "hidapi>=0.14",
    "bleak>=0.21",
]
# Fuer installer/build_installer.py (eigenstaendige IDE-Distribution,
# Windows-Installer/macOS-.dmg/Linux-Tarball -- siehe installer/README.md).
package = ["pyinstaller>=6"]

[project.scripts]
dhrun = "drachenhauch.__main__:main"

[tool.setuptools.packages.find]
include = ["drachenhauch*"]
exclude = ["tests*", "examples*"]

[tool.mypy]
# Statische Typpruefung fuer den Qt-freien Kern (Interpreter, Runtime,
# Sprache sowie die Tracker-/Synth-/Tilemap-Modelle). Die PySide6-Editoren
# (*_qt.py, editor_qt/, spriteeditor/) sind ausgeklammert: die Qt-Stubs sind
# unvollstaendig und wuerden nur Rauschen erzeugen. Scope spaeter erweiterbar.
# `python_version` deckt sich seit 2026-08-01 mit `requires-python` (beides
# 3.12). Gesetzt wurde es urspruenglich aus einem anderen Grund, der weiter
# gilt: neuere numpy-Stubs (numpy>=1.24 ohne Obergrenze) nutzen inzwischen das
# PEP-695-`type`-Statement, das mypy bei python_version<3.12 mit einem
# Parse-Fehler ablehnt -- selbst nur beim Import-Follow, `follow_imports =
# "skip"` verhindert das NICHT (der Parse-Fehler passiert vor dem Skip).
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "silent"
exclude = '(_qt\.py$|/editor_qt/|/spriteeditor/)'
files = ["drachenhauch"]
