name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    # Eine Version: 3.12. Damit wird entwickelt, damit wird paketiert (der
    # Windows-Installer buendelt 3.12, mypy prueft gegen 3.12) -- eine zweite
    # Version zu testen hiess, etwas abzusichern, das niemand benutzt.
    #
    # 3.11 lief hier bis 2026-08-01 mit und starb reproduzierbar mit
    # "Windows fatal exception: code 0xc0000374" (HEAP CORRUPTION im
    # Qt-Teardown) -- auf 3.12 mit demselben PySide6-Wheel gruen. Die
    # Fehlerursache (Zerstoerungs-Reihenfolge in den Editor-Widgets) ist damit
    # NICHT behoben, nur nicht mehr getestet; Notizen dazu in conftest.py.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    # Qt-Editoren headless testen (kein Display auf den Runnern).
    env:
      QT_QPA_PLATFORM: offscreen
      # Fettes LTO (`lto = true` in Cargo.toml) optimiert beim Linken das ganze
      # Programm neu und parallelisiert dabei kaum -- auf einem Runner mit
      # wenigen Kernen ist das der teuerste einzelne Schritt. Gemessen lokal auf
      # 16 Kernen, inkrementell nach einer Aenderung an vm.rs:
      #   fat  79 s     thin  54 s
      # Hier zaehlt ein KORREKTES Binary, kein maximal optimiertes -- getestet
      # wird Verhalten, nicht Geschwindigkeit. `thin` optimiert weiter ueber
      # Crate-Grenzen, kostet aber einen Bruchteil.
      #
      # Bewusst als Umgebungsvariable statt als Profil im Cargo.toml: das
      # ausgelieferte Binary (package.yml) behaelt fettes LTO, und niemand muss
      # daran denken.
      #
      # EHRLICH DAZU: das hier getestete Binary ist damit nicht bitgleich mit dem
      # ausgelieferten. Ein Fehler, der NUR bei fettem LTO auftraete, faende
      # dieser Lauf nicht. Das waere ein Compiler-Fehler und entsprechend selten;
      # der Handel ist bewusst.
      CARGO_PROFILE_RELEASE_LTO: thin

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,editors]"

      - name: Type-check with mypy
        run: mypy

      # OHNE dhrt uebersprang die Suite 1812 von 3096 Tests -- lautlos, per
      # `pytest.skip("native Runtime 'dhrt' nicht gebaut")` in conftest.py.
      # Genau die sichern die SPRACHE ab (jeder run_gb-Golden-Test). Was das
      # kostet, hat die Umbenennung gezeigt: ein kaputter `include_str!`-Pfad
      # in compiler.rs zerlegte den Rust-Build, und die Tests merkten es
      # nicht, weil sie die vorgebaute Exe von der Platte nahmen.
      #
      # Gebaut wird ueber `rust/build_runtime.py` -- dasselbe Skript, das auch
      # Entwickler benutzen. Eine zweite Bau-Wahrheit in der CI waere genau
      # die Sorte Abweichung, die man erst bemerkt, wenn sie auseinanderlaeuft.
      #
      # MIT Grafik, nicht ohne: ohne das `graphics`-Feature liefert
      # `try_graphics` in vm.rs nur `Ok(None)`, SCREEN & Co. gelten dann als
      # unbekannte Builtins -- die Grafik-Tests wuerden FEHLSCHLAGEN statt zu
      # ueberspringen.
      - uses: dtolnay/rust-toolchain@stable

      - name: Rust-Abhaengigkeiten cachen
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/drachenhauch_runtime

      - name: dhrt bauen (Runtime fuer die run_gb-Golden-Tests)
        run: python rust/build_runtime.py

      # spriteeditor_qt_canvas/tilemapeditor_qt bleiben aussen vor: fuer sich
      # genommen gruen, loesen sie im vollen kombinierten Lauf sporadisch einen
      # nativen Access-Violation-Crash in Qts C++-Teardown aus (der Prozess
      # stirbt, kein fangbarer Test-Fehler). Lokal pruefbar mit
      # `pytest tests/test_spriteeditor_qt_canvas.py tests/test_tilemapeditor_qt.py`.
      # Zwei Durchgaenge. Der erste faehrt parallel (pytest-xdist): die Suite
      # rechnet kaum, sie startet dhrt-Prozesse und wartet auf sie -- deshalb
      # skaliert sie fast linear (lokal auf 16 Kernen: 10:40 -> 48 s).
      #
      # `--dist loadfile` haelt die Tests einer Datei beim selben Arbeiter.
      # Nicht aus Aberglaube: Modul-Zustand und die geleakten Qt-Fenster (siehe
      # conftest.py) sind pro Prozess gedacht, nicht pro Test.
      #
      # Der zweite Durchgang holt die vier Dateien nach, die ein Betriebsmittel
      # exklusiv brauchen (Eingabe-Aufzeichnung, Soundkarte, gemessene
      # Laufzeiten) -- Begruendung je Datei in conftest.py bei `_SERIELL`.
      # Zusammen decken die beiden Durchgaenge die Suite exakt ab: 3084 + 41.
      # `--max-worker-restart=0`: stirbt ein Arbeiter NATIV weg (Access
      # Violation in Qts C++-Teardown -- siehe den Hinweis zu
      # spriteeditor_qt_canvas oben), dann bricht pytest sofort ab, statt auf
      # ihn zu warten.
      #
      # Gemessen am 2026-08-20: ein solcher Absturz in
      # test_editor_qt_debugger.py liess den Lauf 31 MINUTEN haengen -- 3135
      # Tests waren durch, einer abgestuerzt, und xdist wartete auf einen
      # Prozess, den es nicht mehr gab. Ohne Abbruch sieht das von aussen aus
      # wie ein Haenger und kostet den halben Vormittag.
      #
      # Das behebt den Absturz NICHT. Es macht ihn sichtbar statt laehmend.
      - name: Run tests (parallel)
        run: pytest tests/ -q -n auto --dist loadfile --max-worker-restart=0 -m "not seriell" -k "not spriteeditor_qt_canvas and not tilemapeditor_qt"

      - name: Run tests (seriell -- exklusive Betriebsmittel)
        run: pytest tests/ -q -m seriell

  # Cross-Platform-Migration Phase 3: auf Linux UND macOS nicht nur BAUEN,
  # sondern TESTEN.
  #
  # Bis 2026-08-20 lief die Suite ausschliesslich unter Windows; Linux und
  # macOS bekamen `cargo check` (Job unten). Das war vertretbar, solange
  # Drachenhauch Spiele exportierte. Seit es auch Kommandozeilen-Werkzeuge,
  # Cron-Jobs und Dienste schreiben soll, ist es das nicht mehr -- die laufen
  # erfahrungsgemaess woanders.
  #
  # Linux kam zuerst und hat sich sofort bezahlt gemacht: die Zip-Slip-
  # Pruefung liess `C:/Windows/...` durch, weil das NUR auf Windows ein
  # absoluter Pfad ist. macOS folgt derselben Vorlage -- ein drittes System
  # kostet hier nur eine Zeile Matrix und faengt genau solche Annahmen.
  #
  # Der Kniff: `dhrt` OHNE Grafik bauen (`default = []`, also kein raylib).
  # Damit braucht der Runner weder X11 noch GL noch einen virtuellen
  # Bildschirm. Gemessen kommen so 2978 Tests durch und 367 werden
  # uebersprungen -- die Sprache selbst, Dateien, Netz, Datenbank, CSV, ZIP,
  # Mengen, Namensraeume und Hintergrund-Auftraege sind vollstaendig dabei.
  # Uebersprungen wird, was Pixel, Fenster, Audio-Pegel oder Eingabe prueft
  # (`_BRAUCHT_GRAFIK` in conftest.py, empirisch ermittelt).
  #
  # `DHRT_OHNE_GRAFIK=1` schaltet das Ueberspringen frei. Ohne die Variable
  # aendert sich nichts -- der Windows-Lauf oben sieht einen fehlenden
  # Grafik-Builtin weiterhin als Fehler, sonst versteckt diese Bequemlichkeit
  # eines Tages eine echte Luecke.
  posix-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      DHRT_OHNE_GRAFIK: "1"
      # Wie im Windows-Job: fettes LTO ist der teuerste Schritt und fuer einen
      # Testlauf unnoetig. Begruendung dort.
      CARGO_PROFILE_RELEASE_LTO: thin

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,editors]"

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust-Abhaengigkeiten cachen
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/drachenhauch_runtime

      # Ohne `graphics`: kein raylib, kein cmake, keine X11-Header. Mit db/net/
      # http, weil genau die Bereiche hier zaehlen.
      - name: dhrt bauen (ohne Grafik)
        working-directory: rust/drachenhauch_runtime
        run: cargo build --release --locked --features "db net http"

      # `not qt`: die Editor-Tests brauchen PySide6 mit libEGL/X11 auf dem
      # Runner. Diesen Job interessiert die SPRACHE, nicht der Qt-Editor --
      # der ist eine Windows-Desktop-Anwendung und wird oben getestet. Ein
      # Haufen X11-Pakete nur fuers headless-Starten von Dialogen waere der
      # falsche Handel.
      - name: Run tests (parallel, ohne Grafik, ohne Qt)
        run: pytest tests/ -q -n auto --dist loadfile --max-worker-restart=0 -m "not seriell and not qt"

      - name: Run tests (seriell)
        run: pytest tests/ -q -m "seriell and not qt"

  # Cross-Platform-Migration Phase 2: erstes automatisches Signal, ob der
  # Rust-Kern (dhrt) auch auf Linux/macOS ueberhaupt kompiliert -- bisher
  # (Stand 2026-07) lief/baute dhrt ausschliesslich unter Windows, nie in CI
  # verifiziert. Bewusst ohne `graphics` (braucht cmake/ALSA/X11-Wayland-Dev-
  # Header, ein spaeterer Schritt) -- hier zaehlt erstmal, ob VM-Kern +
  # Daten-Tier (db/net/http) + das wifi-Feature (Phase 3: Linux/macOS-Zweige
  # noch UNGETESTET, dieser Job ist ihr erstes echtes Kompilier-Signal)
  # plattformunabhaengig sind. serial/usb/bt bleiben vorerst aussen vor --
  # die brauchen zusaetzliche System-Bibliotheken (libudev/D-Bus) und sind
  # ein spaeterer Schritt.
  rust-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rust/drachenhauch_runtime

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: cargo check (VM-Kern, ohne Grafik/Daten/Hardware)
        run: cargo check --locked

      - name: cargo check (+ db/net/http)
        run: cargo check --locked --features "db net http"

      - name: cargo check (+ wifi)
        run: cargo check --locked --features "wifi"
