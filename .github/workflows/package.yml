name: Package (manuell)

on:
  workflow_dispatch:

# Die Pakete OHNE Python fuer macOS und Linux, manuell ueber den Actions-Tab
# ("Run workflow") -- NICHT Teil der push/PR-CI, weil ein Lauf mit Grafik
# und Paketbau mehrere Minuten je System braucht.
#
# Bis 2026-09-21 stand hier zusaetzlich ein Job "package", der ueber
# installer/build_installer.py (PyInstaller) die Qt-Fassung paketierte; der
# ist mit dem Python-Teil geloescht. Den Windows-Installer ohne Python baut
# `dhrt run installer/bauen.dh` mit Inno Setup, das die Laeufer nicht haben.
jobs:
  # Die Pakete OHNE Python fuer macOS und Linux (installer/bauen.dh +
  # installer/paket.dh, 2026-09-19): dhrt MIT Grafik bauen -- das ist hier
  # zum ersten Mal auf diesen Systemen der Fall, die CI baut dort sonst ohne
  # --, dann packt dhrt sich selbst, und das Paket wird ausprobiert:
  #   Linux: entpacken, install.sh mit eigenem HOME, die IDE 60 Bilder lang
  #          unter xvfb starten, dann die Sammlung werkzeug_paket.dhtest mit
  #          dieser Laufzeit (dort startet der Starter die IDE echt).
  #   macOS: das .dmg einhaengen, Signatur und Aufbau pruefen, die App 60
  #          Bilder lang starten.
  # Gebaut wird ohne Python: cargo direkt, mit derselben CFLAGS-Zeile wie
  # rust/build_runtime.py (Tipp-Warteschlange 256).
  paket-ohne-python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CFLAGS: -DMAX_CHAR_PRESSED_QUEUE=256
      CARGO_PROFILE_RELEASE_LTO: thin
      # Nur, damit `if:` fragen kann, ob es die Secrets gibt (secrets.* ist
      # dort nicht erlaubt). Leer ohne Secrets -> ad hoc wie bisher.
      MAC_ZERT_P12: ${{ secrets.MAC_ZERT_P12 }}

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust-Abhaengigkeiten cachen
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/drachenhauch_runtime

      # raylib baut GLFW fuer X11 UND Wayland; Kira spielt ueber ALSA, die
      # Dialoge (rfd) brauchen GTK 3. xvfb fuer den Startversuch.
      - name: System-Bibliotheken (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libasound2-dev libgtk-3-dev \
            libx11-dev libxrandr-dev libxi-dev libxinerama-dev libxcursor-dev \
            libgl1-mesa-dev libwayland-dev libxkbcommon-dev wayland-protocols \
            xvfb xauth

      - name: dhrt bauen (mit Grafik)
        working-directory: rust/drachenhauch_runtime
        run: cargo build --release --locked --features "graphics dialogs video db net http smtp"

      - name: Laufzeit ansehen
        run: rust/drachenhauch_runtime/target/release/dhrt --version

      # Signieren mit Developer ID und Beglaubigen bei Apple -- NUR wenn die
      # Zugangsdaten als Secrets hinterlegt sind (Einrichtung:
      # installer/README.md). Ohne sie baut der Lauf wie bisher ad hoc.
      # Das Zertifikat kommt in einen eigenen, kurzlebigen Schluesselbund;
      # bauen.dh liest nur die Umgebung (DH_MAC_SIGNATUR, DH_NOTAR_*).
      - name: Signatur und Beglaubigung vorbereiten (macOS, nur mit Secrets)
        if: runner.os == 'macOS' && env.MAC_ZERT_P12 != ''
        env:
          MAC_ZERT_PASSWORT: ${{ secrets.MAC_ZERT_PASSWORT }}
          MAC_NOTAR_KEY_P8: ${{ secrets.MAC_NOTAR_KEY_P8 }}
          MAC_NOTAR_KEY_ID: ${{ secrets.MAC_NOTAR_KEY_ID }}
          MAC_NOTAR_ISSUER: ${{ secrets.MAC_NOTAR_ISSUER }}
        run: |
          set -e
          KC="$RUNNER_TEMP/signatur.keychain-db"
          KPW="$(uuidgen)"
          security create-keychain -p "$KPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KPW" "$KC"
          printf '%s' "$MAC_ZERT_P12" | base64 --decode > "$RUNNER_TEMP/zert.p12"
          security import "$RUNNER_TEMP/zert.p12" -k "$KC" -P "$MAC_ZERT_PASSWORT" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/zert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KPW" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          ID="$(security find-identity -v -p codesigning "$KC" | grep 'Developer ID Application' | head -1 | cut -d '"' -f 2)"
          test -n "$ID"
          echo "DH_MAC_SIGNATUR=$ID" >> "$GITHUB_ENV"
          printf '%s' "$MAC_NOTAR_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notar.p8"
          echo "DH_NOTAR_KEY=$RUNNER_TEMP/notar.p8" >> "$GITHUB_ENV"
          echo "DH_NOTAR_KEY_ID=$MAC_NOTAR_KEY_ID" >> "$GITHUB_ENV"
          echo "DH_NOTAR_ISSUER=$MAC_NOTAR_ISSUER" >> "$GITHUB_ENV"

      - name: Paket bauen
        run: rust/drachenhauch_runtime/target/release/dhrt run installer/bauen.dh

      # Jedes Programm mit Fenster stuerzte unter Linux beim BEENDEN ab (Mesa:
      # Grafikspeicher freigegeben, nachdem das Fenster zu war -- gemessen mit
      # gdb, 2026-09-19; behoben ueber die Feldreihenfolge in graphics.rs).
      # Die Probe: ein Beispiel laeuft 10 Bilder und endet mit 0.
      - name: Fensterprogramm endet sauber (Linux)
        if: runner.os == 'Linux'
        run: DHRT_FRAMES=10 xvfb-run -a -s "-screen 0 1920x1080x24" rust/drachenhauch_runtime/target/release/dhrt run examples/09_shapes.dh

      # Der ECHTE Fall ohne Bildschirm (ohne xvfb, DISPLAY leer): eine Meldung
      # mit Zeile und dem Hinweis auf xvfb-run, Rueckgabe 2, kein Panic.
      - name: Ohne Bildschirm eine Meldung statt Panic (Linux)
        if: runner.os == 'Linux'
        run: |
          set +e
          env -u DISPLAY -u WAYLAND_DISPLAY rust/drachenhauch_runtime/target/release/dhrt run examples/09_shapes.dh > "$RUNNER_TEMP/ohne.txt" 2>&1
          RC=$?
          set -e
          cat "$RUNNER_TEMP/ohne.txt"
          test $RC -eq 2
          grep -q "SCREEN: Kein Fenster moeglich -- es gibt keinen Bildschirm" "$RUNNER_TEMP/ohne.txt"
          ! grep -q "panicked" "$RUNNER_TEMP/ohne.txt"
          rust/drachenhauch_runtime/target/release/dhrt test tests/pruef/kein_fenster.dhtest

      - name: Paket ausprobieren (Linux)
        if: runner.os == 'Linux'
        run: |
          set -e
          cd "$RUNNER_TEMP"
          tar xzf "$GITHUB_WORKSPACE"/installer/output/Drachenhauch-IDE-*-linux-*.tar.gz
          export HOME="$RUNNER_TEMP/home"
          mkdir -p "$HOME"
          sh Drachenhauch-IDE-*/install.sh
          test -x "$HOME/.local/share/drachenhauch-ide/dhrt"
          "$HOME/.local/bin/dhrt" --version
          DHRT_FRAMES=60 DH_IDE_LOG="$RUNNER_TEMP/ide.log" DH_IDE_KONFIG="$RUNNER_TEMP/ide.json" \
            xvfb-run -a -s "-screen 0 1920x1080x24" "$HOME/.local/bin/drachenhauch"
          cat "$RUNNER_TEMP/ide.log" | head -20
          grep -qx bereit "$RUNNER_TEMP/ide.log"
          test -f "$HOME/Drachenhauch/examples/183_sfx_generator.dh"

      - name: Sammlung werkzeug_paket (Linux, mit Grafik)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1920x1080x24" rust/drachenhauch_runtime/target/release/dhrt test tests/pruef/werkzeug_paket.dhtest tests/pruef/grafik_aufraeumen.dhtest

      # Die macOS-Laeufer haben kein passendes OpenGL ("NSGL: Failed to find a
      # suitable pixel format", gemessen 2026-09-19) -- ein Fenster geht dort
      # nicht. Geprueft wird darum alles bis zum Fenster: Bundle, Signatur,
      # die Laufzeit mit einem Konsolenprogramm und dass der Starter die
      # Beispiele in den Nutzerordner legt und die IDE aufruft. Ob die IDE
      # auf einem echten Mac aufgeht, sagt erst ein echter Mac.
      - name: Paket ausprobieren (macOS)
        if: runner.os == 'macOS'
        run: |
          set -e
          DMG=$(ls "$GITHUB_WORKSPACE"/installer/output/Drachenhauch-IDE-*-macos-*.dmg)
          hdiutil attach "$DMG" -mountpoint "$RUNNER_TEMP/abbild" -nobrowse
          APP="$RUNNER_TEMP/abbild/Drachenhauch.app"
          ls -la "$RUNNER_TEMP/abbild"
          codesign --verify --deep --strict --verbose=2 "$APP"
          # Hardened Runtime ist Pflicht fuer die Beglaubigung -- und muss
          # schon im Lauf ohne Zugangsdaten gesetzt sein, damit man sieht,
          # dass dhrt damit laeuft.
          codesign -dv "$APP" 2>&1 | tee "$RUNNER_TEMP/signatur.txt"
          grep -Eq 'flags=0x[0-9a-f]+\([^)]*runtime' "$RUNNER_TEMP/signatur.txt"
          plutil -lint "$APP/Contents/Info.plist"
          test -x "$APP/Contents/MacOS/dhrt"
          # dhrt IST das Hauptprogramm, ein Skript gibt es nicht mehr.
          test "$(ls "$APP/Contents/MacOS")" = "dhrt"
          if [ -n "$DH_MAC_SIGNATUR" ]; then
            spctl --assess --type execute -vv "$APP"
            xcrun stapler validate "$DMG"
          fi
          test -f "$APP/Contents/Resources/Drachenhauch.icns"
          "$APP/Contents/MacOS/dhrt" --version
          "$APP/Contents/MacOS/dhrt" run "$APP/Contents/Resources/examples/01_hello.dh"
          export HOME="$RUNNER_TEMP/home"
          mkdir -p "$HOME/Documents"
          set +e
          # Ohne Argumente = wie aus Finder oder Dock (appstart.rs).
          DHRT_FRAMES=60 DH_IDE_LOG="$RUNNER_TEMP/ide.log" DH_IDE_KONFIG="$RUNNER_TEMP/ide.json" \
            "$APP/Contents/MacOS/dhrt" >"$RUNNER_TEMP/start.txt" 2>&1
          RC=$?
          set -e
          cat "$RUNNER_TEMP/start.txt"
          test -f "$HOME/Documents/Drachenhauch/examples/183_sfx_generator.dh"
          if [ $RC -eq 0 ]; then
            grep -qx bereit "$RUNNER_TEMP/ide.log"
            echo "IDE gestartet."
          elif grep -q "Kein Fenster moeglich" "$RUNNER_TEMP/start.txt"; then
            # Seit 2026-09-19 eine Meldung statt eines Panics -- der Panic
            # darf hier nicht mehr auftauchen.
            if grep -q "panicked" "$RUNNER_TEMP/start.txt"; then exit 1; fi
            echo "::notice::IDE-Start auf diesem Laeufer nicht moeglich (kein OpenGL); Starter und Laufzeit laufen."
          else
            exit $RC
          fi
          # Doppelklick im Finder: macOS schickt die Datei als Apple-Event,
          # nicht als Argument (finder.rs). `open -a APP datei` geht denselben
          # Weg ueber LaunchServices. Ein Fenster geht hier nicht auf -- das
          # Protokoll (DHRT_OEFFNEN_PROTOKOLL, ueber launchd an die App
          # vererbt) belegt, dass die Datei in der Laufzeit ankommt.
          LSREG=/System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister
          "$LSREG" -f "$APP"
          "$LSREG" -dump | grep -q "de.drachenhauch.quelltext"
          echo 'PRINT "aus dem Finder"' > "$RUNNER_TEMP/finderprobe.dh"
          launchctl setenv DHRT_OEFFNEN_PROTOKOLL "$RUNNER_TEMP/geoeffnet.txt"
          open -a "$APP" "$RUNNER_TEMP/finderprobe.dh"
          for i in $(seq 1 30); do
            if grep -q "finderprobe.dh" "$RUNNER_TEMP/geoeffnet.txt" 2>/dev/null; then break; fi
            sleep 1
          done
          launchctl unsetenv DHRT_OEFFNEN_PROTOKOLL
          cat "$RUNNER_TEMP/geoeffnet.txt"
          grep -q "finderprobe.dh" "$RUNNER_TEMP/geoeffnet.txt"
          hdiutil detach -force "$RUNNER_TEMP/abbild"

      - name: Sammlung werkzeug_paket (macOS, mit Grafik)
        if: runner.os == 'macOS'
        run: rust/drachenhauch_runtime/target/release/dhrt test tests/pruef/werkzeug_paket.dhtest

      - name: Pakete hochladen
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: drachenhauch-ide-${{ matrix.os }}
          path: |
            installer/output/*.tar.gz
            installer/output/*.dmg
          if-no-files-found: warn
          retention-days: 14
